{{template "head" "Sign in"}}
<main class="login">
  <h1>snare</h1>
  <p>Sign in with a tenant API key. The dashboard is read-only; manage tokens and sinks through the API.</p>
  {{if .Error}}<p class="error" role="alert">That key was not accepted.</p>{{end}}
  <form method="post" action="/login" autocomplete="off">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label for="key">API key</label>
    <input id="key" name="key" type="password" spellcheck="false" required autofocus>
    <button type="submit">Sign in</button>
  </form>
</main>
{{template "foot"}}
