[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "snare-killtest"
version = "0.1.0"
description = "Kill test for Snare: do benign agents leave decoy tools alone?"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# M3c only (docs/M3c-agentdojo.md). Pinned: results are tied to this benchmark version.
agentdojo = ["agentdojo==0.1.35"]

[tool.setuptools.packages.find]
include = ["killtest*"]

[tool.setuptools.package-data]
killtest = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# agentdojo pulls in langsmith, whose auto-loaded pytest plugin we don't use.
addopts = "-p no:langsmith_plugin"
