# Snare detections for Splunk. Copy into an app's local/savedsearches.conf.
# Events arrive through the splunk_hec sink with sourcetype snare:ocsf:detection_finding.
# If you route them to a dedicated index, add index=<yours> to both searches.
# Field paths are checked against real alerts by internal/alert/detections_test.go.

[Snare - Tripwire touched]
description = A planted Snare tripwire (decoy tool, honey credential, canary document or link) was used. No legitimate workflow touches one. Treat the source as compromised or misdirected until shown otherwise. Severity 1 (Informational) is excluded: that is the sink test alert.
search = sourcetype="snare:ocsf:detection_finding" class_uid=2004 metadata.product.name="Snare" severity_id>=4 \
| table _time severity finding_info.title src_endpoint.ip unmapped.channel unmapped.kind unmapped.label unmapped.correlated_tripwires metadata.tenant_uid finding_info.uid
dispatch.earliest_time = -6m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = finding_info.uid
alert.suppress.period = 24h

[Snare - Several tripwires touched by one source]
description = One source touched two or more different Snare tripwires within an hour: an agent working through planted traps. Computed here from raw findings, so it also catches sources whose touches Snare delivered as separate High alerts.
search = sourcetype="snare:ocsf:detection_finding" class_uid=2004 metadata.product.name="Snare" severity_id>=4 \
| stats dc(unmapped.token_id) AS tripwires values(unmapped.label) AS labels values(unmapped.channel) AS channels min(_time) AS first_seen max(_time) AS last_seen BY metadata.tenant_uid src_endpoint.ip \
| where tripwires >= 2
dispatch.earliest_time = -60m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.fields = metadata.tenant_uid,src_endpoint.ip
alert.suppress.period = 1h
