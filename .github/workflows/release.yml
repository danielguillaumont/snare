name: release

# Publishes the server image to GHCR when a version tag is pushed. Nothing else triggers it.
# The image carries an SBOM and SLSA provenance, and is signed keylessly with cosign using
# this workflow's OIDC identity (verify: see deploy/README.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build, push, attest
        run: |
          version=${GITHUB_REF_NAME#v}
          image=ghcr.io/${{ github.repository }}
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --sbom=true --provenance=mode=max \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version="$version" \
            --metadata-file /tmp/meta.json \
            -t "$image:$version" .
          digest=$(jq -r '."containerimage.digest"' /tmp/meta.json)
          echo "IMAGE_REF=$image@$digest" >> "$GITHUB_ENV"
      - name: sign
        run: cosign sign --yes "$IMAGE_REF"
      - name: summary
        run: echo "Published and signed \`$IMAGE_REF\`" >> "$GITHUB_STEP_SUMMARY"
