name: release

# On a version tag, and nothing else:
# - image: publishes the server image to GHCR with an SBOM and SLSA provenance, signed
#   keylessly with cosign using this workflow's OIDC identity (verify: deploy/README.md).
# - binaries: builds static snare binaries for six targets, signs SHA256SUMS keylessly with
#   the same identity, and attaches everything to the GitHub release (docs/M4f-distribution.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build, push, attest
        run: |
          version=${GITHUB_REF_NAME#v}
          image=ghcr.io/${{ github.repository }}
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --sbom=true --provenance=mode=max \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version="$version" \
            --metadata-file /tmp/meta.json \
            -t "$image:$version" .
          digest=$(jq -r '."containerimage.digest"' /tmp/meta.json)
          echo "IMAGE_REF=$image@$digest" >> "$GITHUB_ENV"
      - name: sign
        run: cosign sign --yes "$IMAGE_REF"
      - name: summary
        run: echo "Published and signed \`$IMAGE_REF\`" >> "$GITHUB_STEP_SUMMARY"

  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the release
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v3
      - name: build
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-release.sh
      - name: sign checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: verify as a user would (README "Without Go")
        working-directory: dist
        run: |
          cosign verify-blob --bundle SHA256SUMS.sigstore.json             --certificate-identity-regexp '^https://github.com/danielguillaumont/snare/.github/workflows/release.yml@refs/tags/v'             --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          sha256sum -c SHA256SUMS
          v="${GITHUB_REF_NAME#v}"
          tar -xzf "snare_${v}_linux_amd64.tar.gz" -C /tmp
          test "$(/tmp/snare_${v}_linux_amd64/snare version)" = "snare $v"
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Snare ${GITHUB_REF_NAME#v}" --notes "Release notes to follow."
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/SHA256SUMS.sigstore.json --clobber
